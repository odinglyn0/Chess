[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-gantry"
version = "0.1.0"
description = "JSON-to-G-code framework for a Raspberry Pi chess gantry using Marlin over serial"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.scripts]
chess-gantry = "chess_gantry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
