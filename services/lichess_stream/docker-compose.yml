services:
  lichess-stream:
    build:
      context: ../..
      dockerfile: services/lichess_stream/Dockerfile
    image: chess-lichess-stream:0.1.0
    ports:
      - "8000:8000"
    environment:
      CHESS_STREAM_HOST: "0.0.0.0"
      CHESS_STREAM_PORT: "8000"
      CHESS_STREAM_LOG_LEVEL: "info"
      CHESS_STREAM_LICHESS_BASE_URL: "https://lichess.org"
      CHESS_STREAM_LICHESS_TOKEN: "${LICHESS_TOKEN:-}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else sys.exit(1)",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
