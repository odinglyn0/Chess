[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-gantry"
version = "0.2.0"
description = "JSON-to-G-code framework for a Raspberry Pi chess gantry using Marlin over serial"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyserial>=3.5,<4",
  "websockets>=15,<17",
  "chess>=1.11.2,<2",
]

[project.scripts]
chess-gantry = "chess_gantry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "examples"]
extend-exclude = [".venv", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
