# Raspberry Pi 3B+ chess gantry stack.
#
# Copy .env.example to .env and run ./scripts/docker_host_setup.sh first: it
# writes the host group IDs for dialout/gpio/i2c/spi and checks that the device
# nodes this stack passes through actually exist.
#
#   docker compose build
#   docker compose up -d gantry                    # web dashboard on the LAN
#   docker compose --profile console up -d console # raw G-code console
#   docker compose --profile lan up -d gantry-lan  # own IP on the intranet

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    FEDORA_VERSION: ${FEDORA_VERSION:-42}
    UV_VERSION: ${UV_VERSION:-}
    INCLUDE_GPIO: ${INCLUDE_GPIO:-1}
    INCLUDE_DEV_TOOLS: ${INCLUDE_DEV_TOOLS:-0}
    APP_UID: ${APP_UID:-65532}
    APP_GID: ${APP_GID:-65532}

# GPIO, I2C, SPI and the Marlin USB serial link are passed through as explicit
# device nodes. The cgroup rules additionally authorise the whole character-major
# range for those subsystems, so a controller that re-enumerates after a magnet
# brown-out is still reachable without recreating the container.
x-devices: &devices
  - "${MARLIN_PORT:-/dev/ttyUSB0}:${MARLIN_PORT:-/dev/ttyUSB0}"
  - "${GPIO_MEM_DEVICE:-/dev/gpiomem}:${GPIO_MEM_DEVICE:-/dev/gpiomem}"
  - "${GPIO_CHIP_DEVICE:-/dev/gpiochip0}:${GPIO_CHIP_DEVICE:-/dev/gpiochip0}"
  - "${I2C_DEVICE:-/dev/i2c-1}:${I2C_DEVICE:-/dev/i2c-1}"
  - "${SPI_DEVICE_0:-/dev/spidev0.0}:${SPI_DEVICE_0:-/dev/spidev0.0}"
  - "${SPI_DEVICE_1:-/dev/spidev0.1}:${SPI_DEVICE_1:-/dev/spidev0.1}"

x-device-cgroup-rules: &device-cgroup-rules
  - "c 166:* rwm"
  - "c 188:* rwm"
  - "c 189:* rwm"
  - "c 89:* rwm"
  - "c 153:* rwm"
  - "c 254:* rwm"
  - "c 245:* rwm"

x-volumes: &volumes
  - "./data:/app/data:rw"
  - "./config.json:/app/config.json:ro"
  - "/dev/bus/usb:/dev/bus/usb"
  - "/run/udev:/run/udev:ro"

x-groups: &groups
  - "${DIALOUT_GID:-20}"
  - "${GPIO_GID:-993}"
  - "${I2C_GID:-994}"
  - "${SPI_GID:-995}"

x-environment: &environment
  TZ: ${TZ:-UTC}
  CHESS_GANTRY_SERIAL_PORT: ${MARLIN_PORT:-/dev/ttyUSB0}
  CHESS_GANTRY_WEB_HOST: 0.0.0.0
  CHESS_GANTRY_WEB_PORT: "8000"
  CHESS_GANTRY_CONSOLE_HOST: 0.0.0.0
  CHESS_GANTRY_CONSOLE_PORT: "8300"
  CHESS_GANTRY_WEB_TOKEN: ${CHESS_GANTRY_WEB_TOKEN:-}
  CHESS_GANTRY_DEBUG_TOKEN: ${CHESS_GANTRY_DEBUG_TOKEN:-}
  CHESS_GANTRY_DEMO: ${CHESS_GANTRY_DEMO:-0}
  LICHESS_TOKEN: ${LICHESS_TOKEN:-}
  UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
  UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

x-gantry: &gantry
  image: chess-gantry:${CHESS_GANTRY_TAG:-0.2.0}
  build: *build
  init: true
  restart: unless-stopped
  stop_grace_period: 25s
  user: "${APP_UID:-65532}:${APP_GID:-65532}"
  group_add: *groups
  devices: *devices
  device_cgroup_rules: *device-cgroup-rules
  volumes: *volumes
  environment: *environment
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Web dashboard published on every host interface: reachable over loopback and
  # over the LAN. The app refuses a non-loopback bind without an access token,
  # and the entrypoint generates one into the log if CHESS_GANTRY_WEB_TOKEN is
  # unset. Plain HTTP only, so keep this off the public internet.
  gantry:
    <<: *gantry
    container_name: chess-gantry
    hostname: chess-gantry
    command: ["web"]
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"
    networks:
      - gantry

  # Raw G-code console. Owns the same serial port, so run it instead of gantry,
  # never alongside it.
  console:
    <<: *gantry
    profiles: ["console"]
    container_name: chess-gantry-console
    hostname: chess-gantry-console
    command: ["debug-console"]
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/curl",
          "-sS",
          "--max-time",
          "4",
          "-o",
          "/dev/null",
          "http://127.0.0.1:8300/",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    ports:
      - "${CONSOLE_BIND:-0.0.0.0}:${CONSOLE_PORT:-8300}:8300"
    networks:
      - gantry

  # Same image with a first-class intranet address via macvlan, so the gantry
  # answers on its own LAN IP instead of a published host port. Requires
  # LAN_PARENT, LAN_SUBNET, LAN_GATEWAY and LAN_IP in .env.
  gantry-lan:
    <<: *gantry
    profiles: ["lan"]
    container_name: chess-gantry-lan
    hostname: chess-gantry-lan
    command: ["web"]
    networks:
      lan:
        ipv4_address: ${LAN_IP:-192.168.1.240}

networks:
  gantry:
    driver: bridge
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:-192.168.1.0/24}
          gateway: ${LAN_GATEWAY:-192.168.1.1}
