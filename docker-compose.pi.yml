services:
  chess-gantry:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess-gantry-pi:0.2.0
    init: true
    restart: unless-stopped
    devices:
      - "${CHESS_GANTRY_SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    ports:
      - "${CHESS_GANTRY_WEB_PORT:-8000}:8000"
    environment:
      CHESS_GANTRY_WEB_TOKEN: "${CHESS_GANTRY_WEB_TOKEN:?set CHESS_GANTRY_WEB_TOKEN in .env.docker}"
      HOME: /root
      UV_CACHE_DIR: /tmp/uv-cache
      PYTHONUNBUFFERED: "1"
      CHESS_GANTRY_DISTROLESS: "1"
    volumes:
      - ./config.json:/app/config.json:ro,Z
      - ./data:/app/data:Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 4
