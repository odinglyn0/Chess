[project]
name = "chess-lichess-stream"
version = "0.1.0"
description = "Dockerised uvloop + FastAPI WebSocket service that streams Lichess games as schema-compliant chess board-state updates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137.2",
  "uvicorn[standard]>=0.34.0",
  "uvloop>=0.21.0; sys_platform != 'win32'",
  "httpx>=0.28.1",
  "chess>=1.11.2",
  "jsonschema>=4.23.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.scripts]
chess-lichess-stream = "chess_stream.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_stream"]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
